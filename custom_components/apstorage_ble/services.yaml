set_advanced_schedule:
  name: Set Time-Based Control Schedule
  description: >-
    Set Time-Based Control mode (mode 3) over BLE, with weekly plans (schedule) or
    daily peak/valley windows.
  fields:
    schedule:
      name: Weekly Plans
      description: >-
        Weekly plans, each with the weekdays it applies to and up to 5 charge
        and 5 discharge windows ('HH:MM-HH:MM' or 'HHMMSSHHMMSS'; a window
        ending before it starts runs past midnight). Windows in a plan must
        not overlap, and each weekday may be in only one plan. The EMA app
        uses 15-minute steps. The PCS-native form
        {W: [1..7], valleyTime: [...], peakTime: [...]} is accepted too.
      required: false
      example:
        - weekdays: [mon, tue, wed, thu, fri]
          charge: ["01:00-05:00"]
          discharge: ["17:00-21:00"]
        - weekdays: [sat, sun]
          charge: ["10:00-14:00"]
      selector:
        object:
          label_field: weekdays
          multiple: true
          fields:
            weekdays:
              label: Weekdays
              required: true
              selector:
                select:
                  multiple: true
                  options:
                    - label: Monday
                      value: mon
                    - label: Tuesday
                      value: tue
                    - label: Wednesday
                      value: wed
                    - label: Thursday
                      value: thu
                    - label: Friday
                      value: fri
                    - label: Saturday
                      value: sat
                    - label: Sunday
                      value: sun
            charge:
              label: Charge windows (HH:MM-HH:MM)
              selector:
                text:
                  multiple: true
            discharge:
              label: Discharge windows (HH:MM-HH:MM)
              selector:
                text:
                  multiple: true
    peak_time:
      name: Peak Time Ranges
      description: >-
        Peak/discharge time ranges. Each item must be 'HH:MM-HH:MM' or
        compact 'HHMMSSHHMMSS'. Max 5 ranges.
      required: false
      advanced: true
      example:
        - "16:00-21:00"
      selector:
        object:
    valley_time:
      name: Valley Time Ranges
      description: >-
        Valley/charge time ranges. Each item must be 'HH:MM-HH:MM' or
        compact 'HHMMSSHHMMSS'. Max 5 ranges.
      required: false
      advanced: true
      example:
        - "00:00-06:00"
      selector:
        object:
    entry_id:
      name: Config Entry ID
      description: Optional target entry id. Required if multiple APstorage entries are loaded and address is not provided.
      required: false
      selector:
        text:
    address:
      name: Bluetooth Address
      description: Optional target device MAC address (AA:BB:CC:DD:EE:FF). Required if multiple entries are loaded and entry_id is not provided.
      required: false
      selector:
        text:

