set_peak_power:
  name: Set Peak Power
  description: Set the Peak Shaving power limit over BLE via setsysmode (only while the PCS is in Peak Shaving mode, mode 5).
  fields:
    peak_power:
      name: Peak Power
      description: Peak-shaving power setpoint in watts (100-50000).
      required: true
      example: 5000
      selector:
        number:
          min: 100
          max: 50000
          step: 1
          unit_of_measurement: W
          mode: box
