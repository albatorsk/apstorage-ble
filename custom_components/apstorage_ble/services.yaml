set_system_mode:
  name: Set System Mode
  description: >-
    Set the APstorage system mode over BLE. Peak Valley, Manual Control and
    Peak Shaving are not offered; set them from the EMA app if needed.
  fields:
    mode:
      name: Mode
      description: "Mode code (1, 3, 4, 6) or name (e.g. Time-Based Control, AI Mode)."
      required: true
      example: 3
      selector:
        select:
          options:
            - label: "1 - Self-Consumption"
              value: "1"
            - label: "3 - Time-Based Control"
              value: "3"
            - label: "4 - Backup Power"
              value: "4"
            - label: "6 - AI Mode"
              value: "6"
    entry_id:
      name: Config Entry ID
      description: Optional target entry id. Required if multiple APstorage entries are loaded and address is not provided.
      required: false
      selector:
        text:
    address:
      name: Bluetooth Address
      description: Optional target device MAC address (AA:BB:CC:DD:EE:FF). Required if multiple entries are loaded and entry_id is not provided.
      required: false
      selector:
        text:

